# A throwaway Postgres for the integration tests. Payload creates the schema on
# first connect. Run:
#   docker compose -f docker-compose.test.yml up -d
#   TEST_DATABASE_URL=postgres://postgres:test@localhost:55432/unave_test pnpm test:int
#   docker compose -f docker-compose.test.yml down
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: unave_test
    ports:
      - '55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
